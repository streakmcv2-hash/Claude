name: Build APK

on:
  push:
    branches: [ "claude/calculator-hidden-menu-jxtd9e" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk Kalkulator.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kalkulator-apk
          path: Kalkulator.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Kalkulator.apk --title "Kalkulator APK" --notes "Najnowsza wersja APK" --target "$GITHUB_SHA"
